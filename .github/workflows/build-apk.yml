name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure Executable Gradlew
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: PanoCapture-360-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "PanoCapture 360 - Build #${{ github.run_number }}"
          body: |
            ### 📱 Download & Install
            1. Download the attached **`app-debug.apk`** below directly onto your Android phone.
            2. Tap the downloaded file and select **Install** (allow "Install from Unknown Sources" if prompted).
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
